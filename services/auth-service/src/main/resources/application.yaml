spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/auth_db
    username: ${DB_USERNAME:soham}
    password: ${DB_PASSWORD:soham1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-testing-only-change-in-prod-123456}
    issuer: meshpay-auth
    expiration-ms: 3600000

logging:
  level:
    com.meshpay.auth: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

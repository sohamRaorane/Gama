spring:
  application:
    name: ingestion-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/ingestion_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    com.meshpay.ingestion: INFO
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: meshpay-auth
    expiration-ms: 3600000

meshpay:
  rate-limit:
    capacity: 10
    refill-rate: 5
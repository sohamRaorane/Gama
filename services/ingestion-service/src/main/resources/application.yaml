# =============================================================================
# Ingestion Service Configuration
# =============================================================================
# Loads environment variables from .env (via DotenvLoader) for placeholders
# like ${DB_URL}, ${JWT_SECRET}, etc. Docker Compose sets these via environment.

spring:
  application:
    name: ingestion-service

  # --- PostgreSQL connection (ingestion_db, port 5433 on host) ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/ingestion_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # --- JPA / Hibernate ---
  # ddl-auto=validate: schema is managed exclusively by Flyway migrations,
  # Hibernate only verifies the entity mappings match the database schema.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # --- Flyway database migrations ---
  # Runs SQL scripts in src/main/resources/db/migration/ (V1__baseline.sql, etc.)
  flyway:
    enabled: true

  # --- Redis connection (rate limiter) ---
  # Docker Compose sets REDIS_HOST=redis (service name on meshpay-network).
  # Local development defaults to localhost:6379.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# --- HTTP server port ---
server:
  port: 8082

# --- Actuator (health checks only) ---
# Only /actuator/health is exposed — needed by Docker healthchecks.
# JwtAuthenticationFilter skips /actuator paths (no auth required).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

# --- Logging ---
logging:
  level:
    com.meshpay.ingestion: INFO
    org.hibernate.SQL: WARN

# --- JWT configuration ---
# secret: shared HS256 key with auth-service (from JWT_SECRET env var / .env).
#   Must be ≥ 32 bytes. If missing, JwtTokenProvider.init() throws at startup.
# issuer: must match auth-service's app.jwt.issuer ("meshpay-auth").
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: meshpay-auth
    expiration-ms: 3600000

# --- Per-bridge rate limiting (token bucket in Redis) ---
# capacity: maximum burst size — each bridge starts with this many tokens.
# refill-rate: tokens added per second after burst is exhausted.
# Defaults: capacity=10 (burst of 10), refill=5/sec (1 token per 200ms).
# Redis key format: rate_limit:{bridgeId} (hash with 'tokens' and 'ts' fields).
#
# --- Packet idempotency (Day 12, Redis SET NX EX claim) ---
# ttl-seconds: lifetime of a claimed packet fingerprint so claims expire instead
#   of accumulating forever. Overridable via IDEMPOTENCY_TTL_SECONDS.
# Redis key format: packet_hash:{packetHash} (value "claimed").
# The rate_limit:{bridgeId} and packet_hash:{packetHash} namespaces stay separate:
# rate limiting is per bridge, idempotency is per logical packet.
#
# --- Packet freshness (Day 13) ---
# freshness-window-seconds: max age of a packet timestamp, measured in UTC against
#   the injected Clock. Rule (lower bound inclusive):
#     now - freshness-window-seconds <= timestamp <= now + clock-skew-seconds
#   Default 300s matches HybridCryptoService's packet TTL and the idempotency TTL.
# clock-skew-seconds: how far into the future a timestamp may point. Small and
#   explicit on purpose — a future timestamp must never bypass the age check.
# Order in the pipeline: claim → freshness → decryption. Stale ⇒ 400 PACKET_EXPIRED.
#
# --- Packet decryption (Day 13) ---
# private-key: base64-encoded PKCS#8 RSA private key used ONLY by
#   HybridCryptoService.decrypt(...) (via PacketDecryptionService).
#   Supplied through MESH_CRYPTO_PRIVATE_KEY (never committed; see .env.example).
#   The service fails fast at startup if it is missing or malformed.
meshpay:
  rate-limit:
    capacity: 10
    refill-rate: 5
  idempotency:
    ttl-seconds: ${IDEMPOTENCY_TTL_SECONDS:300}
  packet:
    freshness-window-seconds: ${FRESHNESS_WINDOW_SECONDS:300}
    clock-skew-seconds: ${PACKET_CLOCK_SKEW_SECONDS:30}
  crypto:
    private-key: ${MESH_CRYPTO_PRIVATE_KEY:}